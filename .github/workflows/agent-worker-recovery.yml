name: Agent worker recovery

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch one queued agent stage
        env:
          APP_URL: ${{ vars.RENDER_APP_URL }}
          AGENT_WORKER_SECRET: ${{ secrets.AGENT_WORKER_SECRET }}
        run: |
          if [[ -z "$APP_URL" || -z "$AGENT_WORKER_SECRET" ]]; then
            echo "Configure the RENDER_APP_URL repository variable and AGENT_WORKER_SECRET secret."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST "$APP_URL/api/agent/worker" \
            -H "Authorization: Bearer $AGENT_WORKER_SECRET"
