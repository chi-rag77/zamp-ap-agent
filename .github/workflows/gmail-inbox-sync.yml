name: Gmail inbox sync

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:

permissions:
  id-token: write

concurrency:
  group: gmail-inbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Authenticate and sync Gmail inbox
        env:
          APP_URL: https://zamp-ap-agent.onrender.com
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub Actions OIDC is unavailable for this run."
            exit 1
          fi
          token="$(curl --fail --silent --show-error --get \
            --data-urlencode "audience=$APP_URL" \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq --exit-status --raw-output '.value')"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 240 \
            -X POST "$APP_URL/api/email/cron" \
            -H "Authorization: Bearer $token"
